<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Ashok IT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style1.css}">

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a
            class="navbar-brand"
            th:href="@{/dashboard}">

            <img
                th:src="@{/images/logo.png}"
                class="logo"
                alt="Ashok IT">

        </a>


        <div class="navbar-nav">

            <a
                class="nav-link"
                th:href="@{/dashboard}">

                Home

            </a>

            <a
                class="nav-link"
                th:href="@{/add}">

                Add Enquiry

            </a>

            <a
                class="nav-link"
                th:href="@{/view}">

                View Enquiries

            </a>

        </div>


        <div class="ms-auto">

            <a
                th:href="@{/logout}"
                class="btn logout-btn">

                LOGOUT

            </a>

        </div>

    </div>

</nav>


<!-- DASHBOARD -->

<div class="dashboard-page">

    <div class="dashboard-card">


        <div class="performance">

            <h3>
                Your Performance
            </h3>


            <p>
                Total Enquiries :
                <strong th:text="${response.totalEnqCount}">
                    
                </strong>
            </p>


            <p class="enrolled">

                Enrolled :
                <strong th:text="${response.enrolledCount}">
                    
                </strong>

            </p>


            <p class="lost">

                Lost :
                <strong th:text="${response.lostCount}">
                    
                </strong>

            </p>

        </div>


        <div class="performance-image">

            <img
                th:src="@{/images/lady.png}"
                alt="Counsellor">

        </div>

    </div>

</div>


</body>
</html>
