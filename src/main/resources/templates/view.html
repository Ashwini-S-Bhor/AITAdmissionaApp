<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>View Enquiries - Ashok IT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style1.css}">
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script>
$(document).ready(function() {

    $(".select-control").on("change", function() {

        var cname = $("#cname").val();
        var mode = $("#mode").val();
        var status = $("#status").val();

        console.log("Course : " + cname);
        console.log("Mode   : " + mode);
        console.log("Status : " + status);

        $.ajax({
            type: "GET",
            url: "/filter-enquiries",

            data: {
                cname: cname,
                mode: mode,
                status: status
            },

            success: function(result) {

                console.log(result);

                $("#enqTbl").hide();
                $("#filterResultTbl").html(result);
            },

            error: function(xhr) {
                console.log("ERROR");
                console.log(xhr.status);
                console.log(xhr.responseText);
            }
        });

    });

});</script>
</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a
            class="navbar-brand"
            th:href="@{/dashboard}">

            <img
                th:src="@{/images/logo.png}"
                class="logo"
                alt="Ashok IT">

        </a>


        <div class="navbar-nav">

            <a
                class="nav-link"
                th:href="@{/dashboard}">

                Home

            </a>

            <a
                class="nav-link"
                th:href="@{/add}">

                Add Enquiry

            </a>

            <a
                class="nav-link"
                th:href="@{/view}">

                View Enquiries

            </a>

        </div>


        <div class="ms-auto">

            <a
                th:href="@{/logout}"
                class="btn logout-btn">

                LOGOUT

            </a>

        </div>

    </div>

</nav>



<!-- PAGE -->

<div class="page-container">

    <div class="content-card">


        <h2 class="page-title">
            View Student Enquiries
        </h2>


        <!-- FILTERS -->

        <form
            th:action="@{/view}"
            method="get">

            <div class="filter-row">


                <div class="filter-group">

                    <label>
                        Course
                    </label>

                    <select id="cname" class="select-control">

    <option value="">-Select-</option>

    <option th:each="course : ${coursesNames}"
            th:value="${course}"
            th:text="${course}">
    </option>

</select>

                </div>


                <div class="filter-group">

                    <label>
                        Enquiry Status
                    </label>

                    <select id="status" class="select-control">

    <option value="">-Select-</option>

    <option th:each="status : ${statusNames}"
            th:value="${status}"
            th:text="${status}">
    </option>

</select>

                </div>


                <div class="filter-group">

                    <label>
                        Class Mode
                    </label>

                   <select id="mode" class="select-control">

    <option value="">-Select-</option>

    <option value="Online">Online</option>
    <option value="Offline">Offline</option>

</select>
                </div>

            </div>

        </form>



        <!-- TABLE -->

        <div id="filterResultTbl">

            <table class="enquiry-table"
            id="enqTbl"
            >

                <thead>

                <tr>

                    <th>#</th>

                    <th>Name</th>

                    <th>Course</th>

                    <th>Number</th>

                    <th>Enquiry Date</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="table-body">

                <tr th:each="enquiry : ${student}">

                    <td
                        th:text="${enquiry.enquiryId} +1"></td>
<td
                        th:text="${enquiry.studentName}"></td>
                       <td
                        th:text="${enquiry.courseName}"></td>
                         <td
                        th:text="${enquiry.studentPhno}"> </td>
                       <td
                        th:text="${enquiry.createDate}"></td>
                        <td
                        th:text="${enquiry.enquiryStatus}"> </td>
                        <td>

                        <a th:href="@{/edit(enquiryId=${enquiry.enquiryId})}">EDIT</a> </td>
                         </tr>   
                           <!-- Demo data if list is empty -->

                

                </tbody>

            </table>

        </div>

    </div>

</div>


</body>
</html>
