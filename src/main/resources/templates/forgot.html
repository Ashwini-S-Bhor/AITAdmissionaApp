<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Ashok IT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style1.css}">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-left">

            <img
                th:src="@{/images/logo.png}"
                class="auth-logo"
                alt="Ashok IT">


            <form
                class="auth-form"
                th:action="@{/forgot}"
                method="post">
<p th:text="${succMsg}" class="text-success"/>
<p th:text="${errMsg}" class="text-danger"/>
                <div class="auth-title">
                    Recover Your Password
                </div>


                <input
                    type="email"
                    name="email"
                    class="form-control-custom"
                    placeholder="Email"
                    required>


                <button
                    type="submit"
                    class="auth-btn">

                    SUBMIT

                </button>


                <div class="bottom-text">

                    <span>
                        Don't have an account?
                    </span>

                    <a
                        th:href="@{/signup}"
                        class="outline-btn text-decoration-none">

                        CREATE NEW

                    </a>

                </div>

            </form>

        </div>


        <div class="auth-right">

            <h2>
                Ashok IT is more than just a
                <br>
                Software Training Institute
            </h2>

            <p>
                Student Satisfaction is at most important for us.
            </p>

        </div>

    </div>

</div>

</body>
</html>
