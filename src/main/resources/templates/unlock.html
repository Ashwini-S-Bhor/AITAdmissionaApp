<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Unlock Account - Ashok IT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style1.css}">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-left">

            <img
                th:src="@{/images/logo.png}"
                class="auth-logo"
                alt="Ashok IT">


            <form
                class="auth-form"
                th:action="@{/unlock}"
                method="post">

                <div class="auth-title">
                    Unlock your account here
                </div>


                <p style="font-size: 12px; margin-bottom: 25px;">

                    Your Email :
                    <strong th:text="${userEmail}">
                
                    </strong>

                </p>
<input
                    type="hidden"
                    name="userEmail"
                   th:value="${userEmail}">

                <input
                    type="text"
                    name="Password"
                    class="form-control-custom"
                    placeholder="Temporary Password"
                    required>


                <input
                    type="password"
                    name="newPassword"
                    class="form-control-custom"
                    placeholder="New Password"
                    required>


                <input
                    type="password"
                    name="confirmPwd"
                    class="form-control-custom"
                    placeholder="Confirm Password"
                    required>


                <button
                    type="submit"
                    class="auth-btn">

                    UNLOCK

                </button>


                <div class="bottom-text">

                    <span>
                        Already Unlocked?
                    </span>

                    <a
                        th:href="@{/login}"
                        class="outline-btn text-decoration-none">

                        LOGIN HERE

                    </a>

                </div>

            </form>

        </div>


        <div class="auth-right">

            <h2>
                Ashok IT is more than just a
                <br>
                Software Training Institute
            </h2>

            <p>
                Student Satisfaction is at most important for us.
            </p>

        </div>

    </div>

</div>

</body>
</html>
