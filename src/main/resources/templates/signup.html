<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Ashok IT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style1.css}">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-left">

            <img
                th:src="@{/images/logo.png}"
                class="auth-logo"
                alt="Ashok IT">


            <form
                class="auth-form"
                th:action="@{/signup}"
                th:object="${user}"
                method="post">
<p th:if="${successMsg}" th:text="${successMsg}" class="text-success"></p>

<p th:if="${errorMsg}" th:text="${errorMsg}" class="text-danger"></p>               <div class="auth-title">
                    Please create account here
                </div>


                <input
                    type="text"
                    th:field="*{userName}"
                    class="form-control-custom"
                    placeholder="Name"
                    required>


                <input
                    type="email"
                    th:field="*{userEmail}"
                    class="form-control-custom"
                    placeholder="Email"
                    required>


                <input
                    type="text"
                   th:field="*{userPhno}"
                    class="form-control-custom"
                    placeholder="Phno"
                    required>


               <div  class="auth-btn">
               <input type="submit" value="Sign Up" class="auth-btn"/>
               </div>

                <div class="bottom-text">

                    <span>
                        Do You have an account?
                    </span>

                    <a
                        th:href="@{/login}"
                        class="outline-btn text-decoration-none">

                        LOGIN HERE

                    </a>

                </div>

            </form>

        </div>


        <div class="auth-right">

            <h2>
                Ashok IT is more than just a
                <br>
                Software Training Institute
            </h2>

            <p>
                Student Satisfaction is at most important for us.
            </p>

        </div>

    </div>

</div>

</body>
</html>
