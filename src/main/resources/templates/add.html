<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Enquiry - Ashok IT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style1.css}">

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a
            class="navbar-brand"
            th:href="@{/dashboard}">

            <img
                th:src="@{/images/logo.png}"
                class="logo"
                alt="Ashok IT">

        </a>


        <div class="navbar-nav">

            <a
                class="nav-link"
                th:href="@{/dashboard}">

                Home

            </a>

            <a
                class="nav-link"
                th:href="@{/add}">

                Add Enquiry

            </a>

            <a
                class="nav-link"
                th:href="@{/view}">

                View Enquiries

            </a>

        </div>


        <div class="ms-auto">

            <a
                th:href="@{/logout}"
                class="btn logout-btn">

                LOGOUT

            </a>

        </div>

    </div>

</nav>



<!-- ADD ENQUIRY -->

<div class="page-container">

    <div class="add-card">


        <!-- FORM -->

        <div class="add-form-section">
<p th:text="${succMsg}" class="text-success"/>
<p th:text="${errMsg}" class="text-danger"/>
            <h2 class="add-title">

                Add Student Enquiry Here

            </h2>


            <form
                class="add-form"
                th:action="@{/add}"
                th:object="${enquiry}"
                method="post">
<input type="hidden" th:field="*{enquiryId}">

                <!-- Student Name -->

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    th:field="*{studentName}"
                    placeholder="Student Name"
                    required>



                <!-- Contact Number -->

                <label>
                    Contact Number
                </label>

                <input
                    type="text"
                    th:field="*{studentPhno}"
                    placeholder="Contact Number"
                    required>



                <!-- Class Mode -->

                <label>
                    Class Mode
                </label>

                <select
                    th:field="*{classMode}">

                    <option value="">
                        -Select-
                    </option>

                    <option value="Online">
                        Online
                    </option>

                    <option value="Offline">
                        Offline
                    </option>

                </select>



                <!-- Course -->

                <label>
                    Course
                </label>

                <select
                    th:field="*{courseName}">

                    <option value="">
                        -Select-
                      </option>                 
<option th:each="course: ${courseName}" th:value="${course}"
th:text="${course}"></option>
                </select>
  <!-- Status -->

                <label>
                    Enquiry Status
                </label>

                <select
                    th:field="*{enquiryStatus}">

                   <option value="">-Select-</option>
<option th:each="status: ${enquiryStatus}" th:value="${status}"
th:text="${status}"></option>
                </select>



                <button
                    type="submit"
                    class="submit-blue">

                    SUBMIT

                </button>

            </form>

        </div>



        <!-- IMAGE -->

        <div class="add-image-section">

            <img
                th:src="@{/images/lady.png}"
                alt="Counsellor">

        </div>

    </div>

</div>


</body>
</html>
