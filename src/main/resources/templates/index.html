<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ashok IT</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white">

    <div class="container">

        <!-- Logo -->

        <a class="navbar-brand" th:href="@{/}">

            <img
                th:src="@{/images/logo.png}"
                class="logo"
                alt="Ashok IT">

        </a>


        <!-- Mobile button -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Menu -->

        <div
            class="collapse navbar-collapse"
            id="navbarMenu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        th:href="@{/}">

                        Home

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#">

                        Services

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#courses">

                        Courses

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#">

                        Contact us

                    </a>

                </li>

            </ul>


            <!-- Login -->

            <a
                th:href="@{/login}"
                class="btn login-btn">

                Login

            </a>

        </div>

    </div>

</nav>



<!-- ================= MAIN ================= -->

<main class="container">


    <!-- Banner -->

    <section class="banner-section" >

        <img
            th:src="@{/images/banner1.jpg}"
            class="img-fluid"
             alt="Spring Boot and Microservices">

    </section>



    <!-- Trending Courses -->

    <section id="courses">

        <h2 class="trending-title">

            Trending Courses

        </h2>


        <div class="row g-3">


            <!-- AWS -->

            <div class="col-md-4">

                <div class="course-card">

                    <img
                        th:src="@{/images/aws.png}"
                        alt="AWS">

                </div>

            </div>



            <!-- DevOps -->

            <div class="col-md-4">

                <div class="course-card">

                    <img
                        th:src="@{/images/devops.jpg}"
                        alt="DevOps">

                </div>

            </div>



            <!-- Spring Boot -->

            <div class="col-md-4">

                <div class="course-card">

                    <img
                        th:src="@{/images/spmc.png}"
                        alt="Spring Boot">

                </div>

            </div>


        </div>

    </section>

</main>



<!-- ================= FOOTER ================= -->

<footer>

    © 2022 Ashok IT. All Rights Reserved.

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
